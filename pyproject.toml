[project]
name = "dvd"
version = "0.0.1"
description = "Blu-ray/WEB kaynaklarından ticari kalitede DVD-Video üreten authoring aracı"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12",
    "pyyaml>=6.0",
    "typer>=0.16",
    "vapoursynth>=80",
]

[project.scripts]
dvd = "dvd.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.13",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
